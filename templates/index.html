<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>硕学霸自动签到WEB管理</title>
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>📅 硕学霸签到记录</h1>
    <!-- 年月标题，单独一行 -->
    <div id="monthLabel" class="month-title"></div>
    <!-- 第二行：导航按钮（左）和图例（右） -->
    <div class="nav-legend-row">
        <div class="nav-buttons">
            <button class="blue" id="prevMonth">‹ 上月</button>
            <button class="gray" id="todayMonth">当月</button>
            <button class="blue" id="nextMonth">下月 ›</button>
        </div>
        <div class="legend">
            <div class="legend-item"><span class="color-box green"></span> 本地</div>
            <div class="legend-item"><span class="color-box blue"></span> 平台</div>
            <div class="legend-item"><span class="color-box both"></span> 均有</div>
            <div class="legend-item"><span class="color-box gray"></span> 未签</div>
        </div>
    </div>
    <div id="calendar" class="calendar"></div>

    <div class="section">
        <h2>⚙️ 设置</h2>
        <div class="setting-group">
            <label for="signTime">签到时间：</label>
            <input type="time" id="signTime" value="05:00" step="60">
            <button id="saveSettingBtn">保存设置</button>
            <span id="settingMsg" style="color:#888;"></span>
        </div>
    </div>

    <div class="section">
        <!-- 标题单独一行 -->
        <h2 style="margin:0 0 10px 0;">🔄 更新 Cookies</h2>
        <!-- 提示文字与按钮同一行，按钮靠右 -->
        <div class="cookie-row">
            <p style="margin:0;">支持 <code>key1=value1; key2=value2; ...</code> 或 JSON 格式</p>
            <button id="submitCookieBtn">提交 Cookies</button>
        </div>
        <textarea id="cookieInput" rows="5" placeholder='粘贴 Cookies，例如：csrftoken=xxx; sessionid=yyy'></textarea>
        <div id="msg"></div>
    </div>
</div>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
